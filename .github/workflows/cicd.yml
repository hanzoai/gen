# Canonical caller — every knob lives in /hanzo.yml, none here. It sits in
# .github/workflows because github.com reads nothing else, and this org's own
# runners there carry the `linux-amd64` label hanzoai/ci schedules on.
name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    # v1, the line cli and extension run on: GitHub refused to start a run on
    # the v2 build.yml.
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
