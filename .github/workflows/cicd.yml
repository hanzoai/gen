# Canonical caller — every knob lives in /hanzo.yml, none here. It sits in
# .github/workflows because github.com reads nothing else, and this org's own
# runners there carry the `linux-amd64` label hanzoai/ci schedules on.
name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    # By commit: hanzoai/ci keeps no rule on its tags, so `v2` is whatever was
    # last pushed there, and this job hands it every secret (`secrets: inherit`).
    uses: hanzoai/ci/.github/workflows/build.yml@5262d63804a4207071c05f36321396a616638797 # v2
    secrets: inherit
