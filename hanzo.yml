# hanzoai/gen — the `gen` binary, and the `hanzo-gen` library `hanzo dev` runs.
#
# Gate only: no image, nothing to deploy. The release — five per-platform
# binaries on a GitHub release, named as hanzo.sh installs them — is
# .github/workflows/release.yml, from a tag set by hand.
#
# --locked so Cargo.lock is a fact rather than a suggestion. Rust comes from
# rustup when the runner has none; rust-toolchain.toml names the version.
test:
  - name: build
    run: |
      set -euo pipefail
      command -v cargo >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
      export PATH="$HOME/.cargo/bin:$PATH"
      cargo build --locked
      ./target/debug/gen --version
      ./target/debug/gen --help >/dev/null

  # The suite never touches a home. It runs twice, neither time in the runner's
  # own: against an empty HOME it cannot write, and against an empty one it can,
  # which must still be empty after. The runner is a person's machine (evo runs
  # as its user), and a test that wrote there rewrote that person's agent
  # configs. Cargo and rustup keep their own homes, named before HOME moves.
  - name: test
    run: |
      set -euo pipefail
      export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
      export PATH="$CARGO_HOME/bin:$PATH" RUSTC_WRAPPER=
      unset XDG_DATA_HOME XDG_CONFIG_HOME XDG_CACHE_HOME XDG_STATE_HOME
      ro=$(mktemp -d); tmp=$(mktemp -d)
      trap 'chmod u+w "$ro"; rm -rf "$ro" "$tmp"' EXIT
      chmod 0555 "$ro"
      HOME="$ro" cargo test --locked
      HOME="$tmp" cargo test --locked
      left=$(find "$tmp" -mindepth 1 | head -20)
      [ -z "$left" ] || { echo "::error::the test suite wrote into HOME:"; echo "$left"; exit 1; }

  - name: clippy
    run: |
      set -euo pipefail
      export PATH="$HOME/.cargo/bin:$PATH"
      cargo clippy --locked --all-targets -- -D warnings
